name: Android

# Packs the web build into the Capacitor Android shell. Every push to main produces a debug APK
# (Actions run > Artifacts > planetforge-debug-apk). When the ANDROID_KEYSTORE_BASE64 secret is set,
# a signed release bundle (.aab) for the Play Store is built as well.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/assets/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # Same art pipeline as the Pages build: SVGs -> atlases in public/assets.
      - run: npm --prefix scripts/assets ci
      - run: npm --prefix scripts/assets run assets:gen
      - run: npm --prefix scripts/assets run assets:build
      - run: find public/assets/sprites -mindepth 1 -maxdepth 1 ! -name resources ! -name buildings ! -name discoveries ! -name ui ! -name space ! -name brand ! -name peoples -exec rm -rf {} +
      - run: npm run build
      - run: npx cap sync android
      - name: Version from run number
        run: sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: planetforge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release bundle
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        with:
          name: planetforge-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
