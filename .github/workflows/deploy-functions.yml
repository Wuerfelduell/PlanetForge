name: Deploy game server

# The game-command Edge Function bundles src/sim, so every change to the rules has to reach the
# server too. Needs the repository secret SUPABASE_ACCESS_TOKEN (supabase.com > Account > Access Tokens).
on:
  push:
    branches: [main]
    paths:
      - "src/sim/**"
      - "src/data/**"
      - "supabase/functions/**"
  workflow_dispatch:

concurrency: deploy-functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: cpqegtakybjqhihevzwt
    steps:
      - name: Check for token
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN is not set, game-command was not deployed" && exit 0
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npm ci && npm test
      - name: Bundle
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npm run build:functions
          mkdir -p deploy/supabase/functions/game-command
          cp supabase/functions/game-command/dist/index.js deploy/supabase/functions/game-command/index.js
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Deploy
        if: env.SUPABASE_ACCESS_TOKEN != ''
        working-directory: deploy
        run: |
          printf 'project_id = "planetforge"\n\n[functions.game-command]\nverify_jwt = true\nentrypoint = "./functions/game-command/index.js"\n' > supabase/config.toml
          supabase functions deploy game-command --project-ref "$PROJECT_REF" --use-api
