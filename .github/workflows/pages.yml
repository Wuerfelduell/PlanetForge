name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/assets/package-lock.json
      - run: npm ci
      # Original art: SVGs -> PixiJS atlases in public/assets (generated, not committed).
      - run: npm --prefix scripts/assets ci
      - run: npm --prefix scripts/assets run assets:gen
      - run: npm --prefix scripts/assets run assets:build
      # The game only needs the atlases plus the resource and building icons for the HTML UI.
      - run: find public/assets/sprites -mindepth 1 -maxdepth 1 ! -name resources ! -name buildings ! -name discoveries ! -name ui ! -name space -exec rm -rf {} +
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
